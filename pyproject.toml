[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "F", "W",  # pycodestyle/pyflakes
  "I",              # isort
  "UP",             # pyupgrade
  "B",              # bugbear
]
ignore = [
  "B008",  # Depends() in function defaults is standard FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"services/*.py" = ["E402"]
"production/**/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"examples/*.py" = ["E402"]
"tests/integration/*.py" = ["E402"]
"tests/unit/indicators/test_incremental_manager.py" = ["E402"]
"src/intelligence/schemas.py" = ["E741"]  # 'l' is intentional for OHLCVBar low field

[tool.ruff.lint.isort]
known-first-party = ["src", "production", "services"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = [
  "dashboard/",
]

[dependency-groups]
dev = [
    "statsmodels>=0.14.6",
]


