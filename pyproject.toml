[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "F", "W",  # pycodestyle/pyflakes
  "I",              # isort
  "UP",             # pyupgrade
  "B",              # bugbear
]
ignore = [
  "B008",  # Depends() in function defaults is standard FastAPI pattern
  "B017",  # assertRaises(Exception) — acceptable in unit tests
  "B905",  # zip() without strict= — too noisy across codebase
  "B007",  # loop variable unused — use _var convention when cleaning up
  "F841",  # local variable assigned but never used — common in tests/stubs
  "E501",  # line too long — pre-existing baseline; black enforces 100 on new code
  "UP042", # StrEnum — kept as (str, Enum) intentionally for DB compat (see CLAUDE.md)
]

[tool.ruff.lint.per-file-ignores]
"services/*.py" = ["E402"]
"production/**/*.py" = ["E402", "E501"]  # SQL strings and long operational scripts
"scripts/*.py" = ["E402", "E501"]
"examples/*.py" = ["E402"]
"tests/**/*.py" = ["E501", "E402"]  # test fixtures exceed 100 chars; mid-file imports common
"tools/**/*.py" = ["E501", "E402", "F821", "F404"]
"tools/vulture_whitelist.py" = ["E501", "E402", "F821", "F404", "B018"]  # vulture --make-whitelist output: bare names, not real code
"tests/integration/**/*.py" = ["F821"]  # references to deleted topics in legacy e2e tests
"tests/integration/*.py" = ["E402"]
"tests/unit/indicators/test_incremental_manager.py" = ["E402"]
"src/intelligence/schemas.py" = ["E741"]  # 'l' is intentional for OHLCVBar low field
"src/validation/**/*.py" = ["UP031"]  # legacy % format in SQL strings  # 'l' is intentional for OHLCVBar low field
"src/core/bar_history_seeder.py" = ["E402"]  # deferred imports after async helpers
"src/persistence/repository/signal_ledger_repository.py" = ["E402"]  # deferred imports
"tests/unit/providers/test_base.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "production", "services"]

[tool.vulture]
# Dead-code detection. Baseline backlog (1136 pre-existing findings as of 2026-08-14,
# mostly dataclass/Pydantic fields vulture can't distinguish from real dead code, plus
# genuine unused-code debt) is frozen in tools/vulture_whitelist.py — same "grandfather
# existing, block new" pattern as [tool.ruff]'s E501 baseline above. Triage backlog: todo 309.
paths = ["src", "services", "scripts", "tools/vulture_whitelist.py"]
exclude = ["*/src/intelligence/archive/*"]  # intentionally-retained dead v2.x code, not a gap
min_confidence = 60
sort_by_size = true

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
no_implicit_optional = true
show_error_codes = true
pretty = true
exclude = [
  "dashboard/",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.15.0",
    "statsmodels>=0.14.6",
]
