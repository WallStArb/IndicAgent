groups:
  - name: system_health
    rules:
      - alert: MemoryAvailableCritical
        expr: node_memory_MemAvailable_bytes < 2 * 1024 * 1024 * 1024
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Available RAM below 2 GB — OOM kills imminent"
          description: "Available: {{ $value | humanize1024 }}B. Services will crash. Reduce shared_buffers, kill idle processes, or restart Ollama."

      - alert: MemoryAvailableWarning
        expr: node_memory_MemAvailable_bytes < 4 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Available RAM below 4 GB — system under memory pressure"
          description: "Available: {{ $value | humanize1024 }}B. Review large consumers before this becomes critical."

      - alert: DiskSpaceCritical
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) < 0.20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk less than 20% free on /"
          description: "{{ $value | humanizePercentage }} free. Run: docker system df, du -sh /var/lib/docker/volumes/*"

      - alert: DiskSpaceWarning
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) < 0.40
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk less than 40% free on /"
          description: "{{ $value | humanizePercentage }} free. Monitor TimescaleDB volume growth."

  - name: postgres_health
    rules:
      - alert: DeadTupleRatioHigh
        # series come from the 5-minute postgres-tables job (todo 443): one scrape
        # interval of `for` keeps the alert meaningful at that cadence
        expr: >
          pg_stat_user_tables_n_dead_tup
          / (pg_stat_user_tables_n_live_tup + pg_stat_user_tables_n_dead_tup + 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dead tuple ratio > 5% on {{ $labels.relname }}"
          description: "{{ $value | humanizePercentage }} dead on {{ $labels.relname }}. Run: VACUUM ANALYZE {{ $labels.relname }}. Root cause: OOM kills leaving aborted transactions."

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count{state="active"} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres active connections above 80 (max_connections=100)"
          description: "{{ $value }} active connections. Connection pool exhaustion risk."

      - alert: TimescaleCompressionJobFailed
        expr: >
          increase(pg_stat_bgwriter_checkpoints_req_total[1h]) == 0
          unless on() (time() - pg_stat_bgwriter_stats_reset_timestamp) < 3600
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Check TimescaleDB compression jobs"
          description: "Verify SELECT * FROM timescaledb_information.jobs WHERE last_run_status = 'Error';"

  - name: indicagent_pipeline
    rules:

      - alert: ServiceDown
        expr: indicagent_service_up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.unit }} is down"

      - alert: OTelExportFailure
        expr: increase(otel_export_validation_total[5m]) == 0 and indicagent_service_up == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OTel metric export not reaching collector"
          description: "otel_export_validation_total has not incremented in 5m for a running service. The gRPC exporter may be silently failing. Check collector health and OTEL_EXPORTER_OTLP_ENDPOINT."

      - alert: MetricsStaleByAgent
        expr: |
          (time() - agent_last_message_timestamp_seconds) > 300
          and on(agent_id) indicagent_service_up{unit!=""} == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Agent {{ $labels.agent_id }} stopped exporting metrics (>5m stale)"
          description: "agent_last_message_timestamp_seconds is >300s old for a service that service_auditor reports as up. The agent may be stuck or the OTel export pipeline is broken."

      - alert: ConsumerLagHigh
        expr: persistence_consumer_lag_records > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Consumer lag > 1000 records for {{ $labels.agent_id }}"

  - name: phase83-observability
    rules:
      - alert: PipelineP95LatencyRegression
        expr: |
          histogram_quantile(0.95,
            rate(intelligence_pipeline_plugin_duration_ms_bucket[10m])
          ) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline P95 plugin latency > 500ms sustained 5m"

      - alert: DLQActivity
        expr: increase(dlq_messages_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "DLQ activity detected — {{ $labels.agent }} routing to {{ $labels.topic }}"
          description: "{{ $value }} messages routed to DLQ in last 5m. Every DLQ message is a contract violation."

  - name: phase108_self_healing
    rules:
      - alert: DLQQuarantineSpike
        expr: rate(dlq_quarantine_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DLQ quarantine system active — poison pill detection"
          description: "Quarantine rate {{ $value | humanize }} — investigate (agent, source_topic, error_type) triple with 4+ occurrences in 24h window."

      - alert: ServiceStallDetected
        expr: increase(consumer_stall_detected_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service stall detected — systemd auto-restart triggered"
          description: "Unit {{ $labels.unit }} exceeded 120s without processing. watchdog_notify_total indicates heartbeat rate."

      - alert: OneshotJobFailed
        # Each run is a new series that starts at 1, which increase() cannot see, so look for any failure
        # sample in the hour.
        expr: max by (job_name) (max_over_time(job_completed_total{status="failure"}[1h])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Oneshot job {{ $labels.job_name }} failed; manual investigation required"
          description: "Timer-triggered script exited with error. Check logs for {{ $labels.job_name }} service."

      # Data layer (todo 614 row 21). The nightly capture is a oneshot, so its series lives only
      # while Prometheus keeps the samples; the windows below span a day plus the timer's jitter.
      # job_name is the oneshot's name: the collector renames the OTel `job` attribute because
      # the prometheus exporter reserves `job` for service.name (otel-collector-config.yaml).
      - alert: NightlyCaptureMissed
        expr: absent_over_time(job_completed_total{job_name="alpaca-nightly"}[26h])
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No alpaca-nightly completion in 26h (the 04:40 UTC capture did not run or could not report)"
          description: "Check indicagent-alpaca-nightly.timer and journalctl -u indicagent-alpaca-nightly.service; Persistent=true runs a missed fire at the next boot."

      - alert: DataCaptureBehind
        expr: max by (vendor, timeframe) (last_over_time(data_capture_sessions_behind[26h])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.vendor }} {{ $labels.timeframe }} raw bars trail the last completed NYSE session by {{ $value }} sessions"
          description: "Measured at the end of the last nightly capture from the newest ohlcv_raw bar. Check the nightly summary line for errors, unfinished windows and unselected slots."

      - alert: DataCaptureCoverageLow
        # Live baseline 2026-11-14: 0.993 on 5m and 1d (11 of 1,529 names not current: delisted or
        # halted). Below 0.95 a real share of the universe missed a session.
        expr: min by (vendor, timeframe) (last_over_time(data_capture_coverage_ratio[26h])) < 0.95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.vendor }} {{ $labels.timeframe }}: {{ $value | humanizePercentage }} of the active universe is current to the last completed NYSE session"
          description: "Per-name check at the end of the last nightly capture; DataCaptureBehind reads only the newest bar over the whole universe. Check the nightly summary line for errors, unfinished windows and a budget stop."

      - alert: APIHealthDown
        expr: api_health{service="indicagent-api"} < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FastAPI cannot reach TimescaleDB — health check failing"
          description: "API health probe failed for >1 minute. Check database connectivity and src/api/routes/health.py."

      - alert: WatchdogSuppressionSpike
        expr: rate(watchdog_notify_suppressed_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Systemd watchdog notifications failing — sd_notify() error"
          description: "Suppression rate {{ $value | humanize }} — unit file missing NotifyAccess=main. Check {{ $labels.agent }} systemd config."


  # DIMM temperature (2026-11-23 memory fault: the spd5118 sensors read 117 C under a 16-worker
  # battery block, against a 55 C rating and an 85 C critical limit, and a counted run died with
  # corrupted memory). node_exporter's hwmon collector publishes one series per DIMM; the join on
  # node_hwmon_chip_names selects the spd5118 chips by type, so a different slot address still
  # matches. Normal heavy load runs the DIMMs at 80 to 88 C, so the warning sits above it.
  - name: dimm_temperature
    rules:
      - alert: DimmTemperatureHigh
        expr: >
          max by (instance, chip) (node_hwmon_temp_celsius
          * on (instance, chip) group_left () node_hwmon_chip_names{chip_name="spd5118"}) > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DIMM {{ $labels.chip }} above 90 C for 2 minutes (normal heavy load 80 to 88 C)"
          description: "{{ $value | humanize }} C on {{ $labels.chip }}. Reduce the research worker count and check the case airflow before a run corrupts memory (2026-11-23 fault: 117 C)."

      - alert: DimmTemperatureCritical
        expr: >
          max by (instance, chip) (node_hwmon_temp_celsius
          * on (instance, chip) group_left () node_hwmon_chip_names{chip_name="spd5118"}) > 100
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DIMM {{ $labels.chip }} above 100 C for 1 minute"
          description: "{{ $value | humanize }} C on {{ $labels.chip }}, past the 85 C critical limit. Stop the running research jobs now; results from a run in this state are not trustworthy (2026-11-23 fault)."

      - alert: DimmSensorMissing
        # The host has two DIMMs (chips i2c_2_2_0050 and i2c_2_2_0051). Counting the joined
        # series (a chip with a temperature reading) catches a lost chip listing and a lost
        # reading alike, and matches by chip type, not address.
        expr: >
          (count(node_hwmon_temp_celsius
          * on (instance, chip) group_left () node_hwmon_chip_names{chip_name="spd5118"})
          or vector(0)) < 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Fewer than two spd5118 DIMM temperature sensors visible to node_exporter"
          description: "DIMM overheating alerts are blind. Check indicagent-node-exporter (hwmon collector), the spd5118 kernel driver (`sensors`), and the node scrape."

  # Per-run resource outcome (todo 681; textfile series from tools/run_resource.sh, one file per
  # workload and stage, overwritten by that workload's next run). node_exporter serves a finished run's
  # values until then, so every rule pairs the value with time() - run_resource_end_timestamp_seconds
  # < 3600: a run alerts for one hour after it ends and a stale file never alerts again. run_id sits
  # on run_resource_info only; the group_left join puts it on the alert. oom_kill counts the kernel
  # OOM killer only, so a signalled run with oom_kill 0 is its own warning: exit 143 is a TERM (the DIMM
  # watchdog and launcher traps, an operator kill), exit 137 a SIGKILL from elsewhere. Known gap: a kill
  # of the whole scope (systemd-oomd, cgroup.kill) also ends the emitter, writes no file and alerts
  # nothing; the status line and the launcher log are the only record of such a run.
  - name: run_resource
    rules:
      - alert: RunOomKilled
        expr: >
          (run_resource_oom_kill * on (instance, workload, stage) group_left (run_id) run_resource_info > 0)
          and on (instance, workload, stage) (time() - run_resource_end_timestamp_seconds < 3600)
        labels:
          severity: warning
        annotations:
          summary: "Run {{ $labels.workload }}/{{ $labels.stage }} ({{ $labels.run_id }}) had {{ $value }} process(es) killed by the kernel OOM killer"
          description: "Its results are not trustworthy. memory.peak and the exit code are in the run_resource_ series and the launcher's status line; check the host memory budget before relaunching."
      - alert: RunLeftoverProcesses
        expr: >
          (run_resource_leftover_processes * on (instance, workload, stage) group_left (run_id) run_resource_info > 0)
          and on (instance, workload, stage) (time() - run_resource_end_timestamp_seconds < 3600)
        labels:
          severity: warning
        annotations:
          summary: "Run {{ $labels.workload }}/{{ $labels.stage }} ({{ $labels.run_id }}) left {{ $value }} process(es) running in its scope"
          description: "Orphaned workers still hold DB connections and may be writing: follow the kill procedure in docs/reference/gotchas.md (ProcessPoolExecutor orphans) and confirm zero remain."
      - alert: RunKilledWithoutOom
        expr: >
          ((run_resource_exit_code == 137 or run_resource_exit_code == 143)
          * on (instance, workload, stage) group_left (run_id) run_resource_info
          and on (instance, workload, stage) run_resource_oom_kill == 0)
          and on (instance, workload, stage) (time() - run_resource_end_timestamp_seconds < 3600)
        labels:
          severity: warning
        annotations:
          summary: "Run {{ $labels.workload }}/{{ $labels.stage }} ({{ $labels.run_id }}) was signalled (exit {{ $value }}) with no kernel OOM kill"
          description: "Exit 137 (SIGKILL) or 143 (TERM: the DIMM watchdog, a launcher trap or an operator) with oom_kill 0. Read the launcher log and family10_dimm_temp.log before trusting or resuming the run."

  # ubuntu2 backup and mirror (metrics from production/standby/standby_probe.sh). Alerting is
  # not wired to a pager; these rules turn the Grafana panel red and show on /alerts.
  - name: standby_backup
    rules:
      - alert: StandbyBaseBackupStale
        expr: time() - standby_job_last_success_timestamp_seconds{task="base_backup"} > 8 * 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ubuntu2 base backup older than 8 days (weekly timer)"
          description: "Check: ssh ubuntu2 'systemctl status indicagent-pg-base-backup.service; tail ~/backup/*.log'"

      - alert: StandbyMirrorStale
        expr: time() - standby_job_last_success_timestamp_seconds{task="data_mirror"} > 26 * 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ubuntu2 data mirror older than 26 hours (daily timer)"
          description: "Check: ssh ubuntu2 'journalctl -u indicagent-data-mirror.service -n 30'"

      - alert: StandbyWalArchiveDown
        expr: standby_unit_active{unit="indicagent-pg-wal-archive.service"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ubuntu2 WAL archive service is not running"
          description: "pg_receivewal stopped; the slot holds WAL on ubuntu1 until max_slot_wal_keep_size. Restart indicagent-pg-wal-archive.service on ubuntu2."

      - alert: StandbyUnitFailed
        expr: standby_unit_failed == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ubuntu2 unit {{ $labels.unit }} is in failed state"
          description: "Check: ssh ubuntu2 'journalctl -u {{ $labels.unit }} -n 30'"

      - alert: StandbyProbeBlind
        expr: standby_probe_success == 0 or time() - standby_probe_timestamp_seconds > 900 or absent(standby_probe_timestamp_seconds)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "standby probe cannot read ubuntu2 (ssh down or probe timer stopped)"
          description: "Backup status is unknown, not good. Check ubuntu2 reachability and indicagent-standby-probe.timer on ubuntu1."
