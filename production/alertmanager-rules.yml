groups:
  - name: system_health
    rules:
      - alert: MemoryAvailableCritical
        expr: node_memory_MemAvailable_bytes < 2 * 1024 * 1024 * 1024
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Available RAM below 2 GB — OOM kills imminent"
          description: "Available: {{ $value | humanize1024 }}B. Services will crash. Reduce shared_buffers, kill idle processes, or restart Ollama."

      - alert: MemoryAvailableWarning
        expr: node_memory_MemAvailable_bytes < 4 * 1024 * 1024 * 1024
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Available RAM below 4 GB — system under memory pressure"
          description: "Available: {{ $value | humanize1024 }}B. Review large consumers before this becomes critical."

      - alert: DiskSpaceCritical
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) < 0.20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk less than 20% free on /"
          description: "{{ $value | humanizePercentage }} free. Run: docker system df, du -sh /var/lib/docker/volumes/*"

      - alert: DiskSpaceWarning
        expr: >
          (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) < 0.40
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk less than 40% free on /"
          description: "{{ $value | humanizePercentage }} free. Monitor TimescaleDB volume growth."

  - name: postgres_health
    rules:
      - alert: DeadTupleRatioHigh
        expr: >
          pg_stat_user_tables_n_dead_tup
          / (pg_stat_user_tables_n_live_tup + pg_stat_user_tables_n_dead_tup + 1) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Dead tuple ratio > 5% on {{ $labels.relname }}"
          description: "{{ $value | humanizePercentage }} dead on {{ $labels.relname }}. Run: VACUUM ANALYZE {{ $labels.relname }}. Root cause: OOM kills leaving aborted transactions."

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count{state="active"} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres active connections above 80 (max_connections=100)"
          description: "{{ $value }} active connections. Connection pool exhaustion risk."

      - alert: TimescaleCompressionJobFailed
        expr: >
          increase(pg_stat_bgwriter_checkpoints_req_total[1h]) == 0
          unless on() (time() - pg_stat_bgwriter_stats_reset_timestamp) < 3600
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Check TimescaleDB compression jobs"
          description: "Verify SELECT * FROM timescaledb_information.jobs WHERE last_run_status = 'Error';"

  - name: indicagent_pipeline
    rules:
      - alert: ProviderDataStoppage
        expr: >
          rate(provider_bars_produced_total[5m]) == 0
          and indicagent_service_up{unit="indicagent-ibkr-provider"} == 1
          and (hour() >= 6 and hour() <= 21)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "IBKR provider producing zero bars during active session"

      - alert: ServiceDown
        expr: indicagent_service_up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.unit }} is down"

      - alert: OTelExportFailure
        expr: increase(otel_export_validation_total[5m]) == 0 and indicagent_service_up == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OTel metric export not reaching collector"
          description: "otel_export_validation_total has not incremented in 5m for a running service. The gRPC exporter may be silently failing. Check collector health and OTEL_EXPORTER_OTLP_ENDPOINT."

      - alert: MetricsStaleByAgent
        expr: |
          (time() - agent_last_message_timestamp_seconds) > 300
          and on(agent_id) indicagent_service_up{unit!=""} == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Agent {{ $labels.agent_id }} stopped exporting metrics (>5m stale)"
          description: "agent_last_message_timestamp_seconds is >300s old for a service that service_auditor reports as up. The agent may be stuck or the OTel export pipeline is broken."

      - alert: ConsumerLagHigh
        expr: persistence_consumer_lag_records > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Consumer lag > 1000 records for {{ $labels.agent_id }}"

  - name: phase81-signal-lifecycle
    interval: 1m
    rules:
      - alert: P81_SignalTrackerInvalidSignals
        expr: increase(signal_tracker_invalid_signal_total[5m]) > 0
        for: 5m
        labels:
          severity: page
          phase: "81"
        annotations:
          summary: "signal_tracker rejecting signals (publisher contract violation)"
          description: "_load_signal() rejected {{ $value }} signals in last 5m. Reason label indicates which field. Publisher must guarantee timestamp/symbol/timeframe/entry_price/stop_loss."

      - alert: P81_SignalReplayOhlcvGap
        expr: increase(signal_replay_ohlcv_gap_total[15m]) > 10
        for: 5m
        labels:
          severity: page
          phase: "81"
        annotations:
          summary: "signal_replay_auditor finding signals with no OHLCV data in window"
          description: "{{ $value }} replay attempts had zero matching bars in market_data_ohlcv. Data integrity issue in OHLCV pipeline."

      - alert: P81_SignalReplayUnresolvedGrowing
        expr: deriv(signal_replay_unresolved_gauge[15m]) > 0
        for: 10m
        labels:
          severity: page
          phase: "81"
        annotations:
          summary: "signal_replay_unresolved_gauge growing across 2+ cycles (replay auditor stuck)"
          description: "Unresolved v1 signals trending upward. North star invariant violated. Investigate signal_replay_auditor logs."

      - alert: P81_LifecycleWriterIdempotentSkipHigh
        expr: increase(lifecycle_writer_idempotent_skip_total[1h]) > 100
        for: 5m
        labels:
          severity: warn
          phase: "81"
        annotations:
          summary: "lifecycle_writer idempotency guard firing frequently (>100/hour)"
          description: "Two-path collision rate elevated. Investigate whether live tracker and replay auditor are racing on the same signals."

  - name: phase83-observability
    rules:
      - alert: LLMCircuitBreakerOpen
        expr: increase(circuit_breaker_state_transitions_total{to_state="open"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "LLM/IBKR circuit breaker tripped to OPEN ({{ $labels.plugin_name }})"

      - alert: SwarmCapacitySkipRateHigh
        expr: |
          rate(swarm_invocations_total{status="error"}[5m])
          / rate(swarm_invocations_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Swarm agent error rate >50% of invocations — signal quality degraded"

      - alert: ShadowPluginEVDecayed
        expr: shadow_ev_r < -0.05
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Shadow plugin {{ $labels.plugin }} EV[R] < -0.05 sustained 30m"

      - alert: PipelineP95LatencyRegression
        expr: |
          histogram_quantile(0.95,
            rate(intelligence_pipeline_plugin_duration_ms_bucket[10m])
          ) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline P95 plugin latency > 500ms sustained 5m"

      - alert: DLQActivity
        expr: increase(dlq_messages_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "DLQ activity detected — {{ $labels.agent }} routing to {{ $labels.topic }}"
          description: "{{ $value }} messages routed to DLQ in last 5m. Every DLQ message is a contract violation."

  - name: phase108_self_healing
    rules:
      - alert: DLQQuarantineSpike
        expr: rate(dlq_quarantine_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DLQ quarantine system active — poison pill detection"
          description: "Quarantine rate {{ $value | humanize }} — investigate (agent, source_topic, error_type) triple with 4+ occurrences in 24h window."

      - alert: ServiceStallDetected
        expr: increase(consumer_stall_detected_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service stall detected — systemd auto-restart triggered"
          description: "Unit {{ $labels.unit }} exceeded 120s without processing. watchdog_notify_total indicates heartbeat rate."

      - alert: OneshotJobFailed
        expr: increase(job_completed_total{status="failure"}[1h]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Oneshot job {{ $labels.job }} failed — manual investigation required"
          description: "Timer-triggered script exited with error. Check logs for {{ $labels.job }} service."

      - alert: APIHealthDown
        expr: api_health{service="indicagent-api"} < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FastAPI cannot reach TimescaleDB — health check failing"
          description: "API health probe failed for >1 minute. Check database connectivity and src/api/routes/health.py."

      - alert: WatchdogSuppressionSpike
        expr: rate(watchdog_notify_suppressed_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Systemd watchdog notifications failing — sd_notify() error"
          description: "Suppression rate {{ $value | humanize }} — unit file missing NotifyAccess=main. Check {{ $labels.agent }} systemd config."
