# Dragonfly sample configuration for IndicAgent
# Version: 1.0.0
# Last Updated: 2025-08-08
# Status: Current ✅

# Enable AOF persistence
aof-enabled yes
aof-use-rdb-preamble yes

# Snapshotting (safe defaults)
save 900 1
save 300 10
save 60 10000

# Maxmemory policy (prefer no-eviction for streams; tune as needed)
maxmemory-policy noeviction

# IO threads (auto)
# Dragonfly uses multi-threading by default; override if needed.

# TCP keepalive
tcp-keepalive 300

# Latency monitor
latency-monitor-threshold 100


