# Prometheus config for IndicAgent -- unified OTel Collector scrape
# All agent metrics flow through OTel Collector's Prometheus exporter (:8889)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alertmanager-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["host.docker.internal:9093"]

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["host.docker.internal:8889"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["host.docker.internal:9093"]

  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["indicagent-postgres-exporter:9187"]
  # the per-table stats at a 5-minute scrape (todo 443): the chunk walk costs about 850 ms
  # per call, which at 15 s made monitoring the top database consumer
  - job_name: "postgres-tables"
    scrape_interval: 5m
    static_configs:
      - targets: ["indicagent-postgres-exporter-tables:9187"]
