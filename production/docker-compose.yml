# IndicAgent Infrastructure
# TimescaleDB + Redpanda + Ollama

services:
  timescaledb:
    build:
      context: .
      dockerfile: Dockerfile.timescaledb
    container_name: timescaledb
    restart: unless-stopped
    shm_size: '512m'
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d indicagent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    command: [
      "postgres",
      "-c", "max_connections=200",
      "-c", "max_locks_per_transaction=16384",
      "-c", "wal_buffers=8192",
      "-c", "log_min_duration_statement=1000",
      "-c", "shared_buffers=3GB",
      "-c", "work_mem=8MB"
    ]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=indicagent
      - TIMESCALEDB_TELEMETRY=off
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql
      - ./:/workspace:rw

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.10
    container_name: redpanda
    restart: unless-stopped
    mem_limit: 6g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "19092:19092"   # Kafka API — host services use localhost:19092
      - "18082:18082"   # HTTP proxy (optional)
      - "18081:18081"   # Schema registry (optional, for future use)
      - "9644:9644"     # Admin API + Prometheus metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=2
      - HSA_OVERRIDE_GFX_VERSION=11.5.0
      - OLLAMA_KEEP_ALIVE=5m
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "992"
      - "44"
    volumes:
      - ollama-data:/root/.ollama

  # node-exporter: exposes host-level RAM, disk, CPU metrics to Prometheus
  node-exporter:
    image: prom/node-exporter:latest
    container_name: indicagent-node-exporter
    restart: unless-stopped
    pid: host
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"

  # postgres-exporter: exposes TimescaleDB metrics (dead tuples, connections, table sizes)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: indicagent-postgres-exporter
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@timescaledb:5432/indicagent?sslmode=disable"
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
    ports:
      - "9187:9187"
    depends_on:
      - timescaledb

  # Prometheus: scrapes IndicAgent service /metrics (ports 9109, 9112–9116 on host)
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: indicagent-prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=10d"
      - "--storage.tsdb.retention.size=3GB"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertmanager-rules.yml:/etc/prometheus/alertmanager-rules.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana: dashboards and alerts; add Prometheus (and optionally PostgreSQL) as data sources
  # Port 3001 to avoid conflict with IndicAgent dashboard (Next.js on 3000)
  grafana:
    image: grafana/grafana:13.0.1-security-01
    container_name: indicagent-grafana
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

  tempo:
    image: grafana/tempo:3.0.0
    container_name: indicagent-tempo
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: indicagent-otel-collector
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      - INDICAGENT_ENV=${INDICAGENT_ENV:-dev}
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver (existing agents already send here)
      - "8889:8889"   # Prometheus metrics exporter (scraped by Prometheus)
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: indicagent-alertmanager
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:3.7.2
    container_name: indicagent-loki
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
    command: -config.file=/etc/loki/config.yaml

  # IB Gateway — headless, live trading via Docker
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ib-gateway
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: live
      API_PORT: 4001
      SOCAT_PORT: 4004
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      BYPASS_WARNING: "yes"
      ExistingSessionDetectedAction: primaryoverride
      TWS_ACCEPT_INCOMING: accept
      READ_ONLY_API: "no"
      VNC_SERVER_PASSWORD: indicagent
      GATEWAY_OR_TWS: gateway
      IB_GATEWAY_VERSION: "10.45.1d"
      AUTO_RESTART_TIME: "11:59 PM"
      TIME_ZONE: Etc/UTC
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:7497:4003"
      - "127.0.0.1:5900:5900"
    volumes:
      - ib-gateway-settings:/home/ibgateway/Jts

volumes:
  timescale-data:
  redpanda-data:
  ollama-data:
  node-exporter-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
  ib-gateway-settings:

