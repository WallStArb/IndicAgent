# promtool test rules production/alertmanager-rules.dimm.test.yml  (run from production/)
rule_files:
  - alertmanager-rules.yml
evaluation_interval: 1m
tests:
  # normal heavy load (80 to 88 C) fires nothing; two DIMMs present
  - interval: 1m
    input_series:
      - series: 'node_hwmon_chip_names{chip="i2c_2_2_0050", chip_name="spd5118", instance="h:9100"}'
        values: '1x30'
      - series: 'node_hwmon_chip_names{chip="i2c_2_2_0051", chip_name="spd5118", instance="h:9100"}'
        values: '1x30'
      - series: 'node_hwmon_temp_celsius{chip="i2c_2_2_0050", sensor="temp1", instance="h:9100"}'
        values: '88x30'
      - series: 'node_hwmon_temp_celsius{chip="i2c_2_2_0051", sensor="temp1", instance="h:9100"}'
        values: '80x30'
    alert_rule_test:
      - {eval_time: 20m, alertname: DimmTemperatureHigh, exp_alerts: []}
      - {eval_time: 20m, alertname: DimmTemperatureCritical, exp_alerts: []}
      - {eval_time: 20m, alertname: DimmSensorMissing, exp_alerts: []}
  # one DIMM at 117 C (the 2026-11-23 reading) fires both for that chip only, and a non-DIMM
  # chip at 117 C does not
  - interval: 1m
    input_series:
      - series: 'node_hwmon_chip_names{chip="i2c_2_2_0050", chip_name="spd5118", instance="h:9100"}'
        values: '1x30'
      - series: 'node_hwmon_chip_names{chip="i2c_2_2_0051", chip_name="spd5118", instance="h:9100"}'
        values: '1x30'
      - series: 'node_hwmon_chip_names{chip="pci0000:00_0000:00:01_1_0000:01:00_0", chip_name="nvme", instance="h:9100"}'
        values: '1x30'
      - series: 'node_hwmon_temp_celsius{chip="i2c_2_2_0050", sensor="temp1", instance="h:9100"}'
        values: '117x30'
      - series: 'node_hwmon_temp_celsius{chip="i2c_2_2_0051", sensor="temp1", instance="h:9100"}'
        values: '85x30'
      - series: 'node_hwmon_temp_celsius{chip="pci0000:00_0000:00:01_1_0000:01:00_0", sensor="temp1", instance="h:9100"}'
        values: '117x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: DimmTemperatureHigh
        exp_alerts:
          - exp_labels: {severity: warning, instance: "h:9100", chip: i2c_2_2_0050}
            exp_annotations:
              summary: "DIMM i2c_2_2_0050 above 90 C for 2 minutes (normal heavy load 80 to 88 C)"
              description: "117 C on i2c_2_2_0050. Reduce the research worker count and check the case airflow before a run corrupts memory (2026-11-23 fault: 117 C)."
      - eval_time: 5m
        alertname: DimmTemperatureCritical
        exp_alerts:
          - exp_labels: {severity: critical, instance: "h:9100", chip: i2c_2_2_0050}
            exp_annotations:
              summary: "DIMM i2c_2_2_0050 above 100 C for 1 minute"
              description: "117 C on i2c_2_2_0050, past the 85 C critical limit. Stop the running research jobs now; results from a run in this state are not trustworthy (2026-11-23 fault)."
      # a 30 s spike does not page: the warning needs 2 minutes
      - {eval_time: 1m, alertname: DimmTemperatureHigh, exp_alerts: []}
  # one sensor gone: DimmSensorMissing fires after 10 minutes
  - interval: 1m
    input_series:
      - series: 'node_hwmon_chip_names{chip="i2c_2_2_0050", chip_name="spd5118", instance="h:9100"}'
        values: '1x30'
      - series: 'node_hwmon_temp_celsius{chip="i2c_2_2_0050", sensor="temp1", instance="h:9100"}'
        values: '80x30'
    alert_rule_test:
      - {eval_time: 5m, alertname: DimmSensorMissing, exp_alerts: []}
      - eval_time: 15m
        alertname: DimmSensorMissing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Fewer than two spd5118 DIMM temperature sensors visible to node_exporter"
              description: "DIMM overheating alerts are blind. Check indicagent-node-exporter (hwmon collector), the spd5118 kernel driver (`sensors`), and the node scrape."
  # both chips listed but one temperature reading lost (an i2c read error): still fires
  - interval: 1m
    input_series:
      - series: 'node_hwmon_chip_names{chip="i2c_2_2_0050", chip_name="spd5118", instance="h:9100"}'
        values: '1x30'
      - series: 'node_hwmon_chip_names{chip="i2c_2_2_0051", chip_name="spd5118", instance="h:9100"}'
        values: '1x30'
      - series: 'node_hwmon_temp_celsius{chip="i2c_2_2_0050", sensor="temp1", instance="h:9100"}'
        values: '80x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: DimmSensorMissing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Fewer than two spd5118 DIMM temperature sensors visible to node_exporter"
              description: "DIMM overheating alerts are blind. Check indicagent-node-exporter (hwmon collector), the spd5118 kernel driver (`sensors`), and the node scrape."
  # no sensors at all
  - interval: 1m
    input_series:
      - series: 'up{job="node"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: DimmSensorMissing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Fewer than two spd5118 DIMM temperature sensors visible to node_exporter"
              description: "DIMM overheating alerts are blind. Check indicagent-node-exporter (hwmon collector), the spd5118 kernel driver (`sensors`), and the node scrape."
