# alert-rules.yml — COMMITTED
# Grafana unified alerting rules for IndicAgent pipeline.
# Contact points: telegram-critical (CRITICAL), discord-ops (HIGH/MEDIUM)
# All PromQL expressions reference current active service names only.
apiVersion: 1

groups:
  - orgId: 1
    name: IndicAgent CRITICAL Alerts
    folder: IndicAgent
    interval: 1m
    rules:

      - uid: provider_dead_uid
        title: provider_dead
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: rate(provider_bars_produced_total[5m])
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "IBKR provider producing zero bars for 5+ minutes"
          description: "rate(provider_bars_produced_total[5m]) == 0. Check indicagent-ibkr-provider."
        labels:
          severity: critical
          contact_point: telegram-critical

      - uid: service_crash_looping_uid
        title: service_crash_looping
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: rate(service_auditor_service_restarts_total[10m])
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0.005]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations:
          summary: "Service crash-looping: > 3 restarts in 10 minutes"
          description: "rate(service_auditor_service_restarts_total[10m]) > 3/600s. Service: {{ $labels.service_name }}"
        labels:
          severity: critical
          contact_point: telegram-critical

      - uid: signals_dropped_uid
        title: signals_dropped
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: increase(signal_writer_agent_buffer_overflow_total[5m])
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations:
          summary: "Signals being dropped by signal writer buffer"
          description: "increase(signal_writer_agent_buffer_overflow_total[5m]) > 0. Training data loss in progress."
        labels:
          severity: critical
          contact_point: telegram-critical

      - uid: signal_dlq_growing_uid
        title: signal_dlq_growing
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: increase(intelligence_pipeline_signal_dlq_total[5m])
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations:
          summary: "Signal DLQ growing — null-CIS signals detected"
          description: "increase(intelligence_pipeline_signal_dlq_total[5m]) > 0. CIS regression in I7 pipeline."
        labels:
          severity: critical
          contact_point: telegram-critical

      - uid: data_completeness_critical_uid
        title: data_completeness_critical
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: bar_auditor_canonical_completeness_pct
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0.9]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Data completeness below 90% — ML training impact"
          description: "bar_auditor_canonical_completeness_pct < 90% for {{ $labels.symbol }}/{{ $labels.tf }}."
        labels:
          severity: critical
          contact_point: telegram-critical

  - orgId: 1
    name: IndicAgent HIGH Alerts
    folder: IndicAgent
    interval: 1m
    rules:

      - uid: consumer_lag_writer_uid
        title: consumer_lag_writer
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: persistence_consumer_lag_records
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1000]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "Writer consumer lag > 1000 messages"
          description: "persistence_consumer_lag_records > 1000 for agent {{ $labels.agent_id }}. DB write backlog."
        labels:
          severity: high
          contact_point: discord-ops

      - uid: bar_flow_stale_uid
        title: bar_flow_stale
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: bar_agg_time_since_last_bar_seconds
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [300]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "Bar flow stale — no bars in 5+ minutes"
          description: "bar_agg_time_since_last_bar_seconds > 300. Aggregator may be stuck."
        labels:
          severity: high
          contact_point: discord-ops

      - uid: output_buffer_pressure_uid
        title: output_buffer_pressure
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: intelligence_pipeline_output_buffer_depth
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [400]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "Intelligence pipeline output buffer > 400 depth"
          description: "intelligence_pipeline_output_buffer_depth > 400. Writer is falling behind."
        labels:
          severity: high
          contact_point: discord-ops

      - uid: gap_fill_dlq_growing_uid
        title: gap_fill_dlq_growing
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: increase(bar_auditor_gap_fill_dlq_depth[5m])
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations:
          summary: "Gap fill DLQ growing — gap requests failing after retry"
          description: "increase(bar_auditor_gap_fill_dlq_depth[5m]) > 0. IBKR gap fill retries exhausted."
        labels:
          severity: high
          contact_point: discord-ops

      - uid: dlq_depth_exceeded_uid
        title: dlq_depth_exceeded
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: dlq_depth
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [1000]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Dead Letter Queue depth exceeded"
          description: "Agent {{ $labels.agent }} has {{ $value }} messages in DLQ topic {{ $labels.topic }}. Data quality issue detected."
        labels:
          severity: high
          contact_point: discord-ops

      - uid: bar_integrity_failing_uid
        title: bar_integrity_failing
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: last_over_time(bar_integrity_failing_names[36h])
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "A bar_integrity check has failing names"
          description: "bar_integrity_failing_names is {{ $value }} for check {{ $labels.check }} in the latest D7 report. Promotion and the phase 186 rebuild refuse these names. D7 is a daily oneshot; the lookback outlasts the gap between runs."
        labels:
          severity: high
          contact_point: discord-ops

      - uid: bar_integrity_report_stale_uid
        title: bar_integrity_report_stale
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: last_over_time(bar_integrity_report_age_seconds[36h]) > bool last_over_time(bar_integrity_report_max_age_seconds[36h])
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "bar_integrity report older than its APR maximum"
          description: "The previous D7 report had stood longer than threshold.bar_integrity.report_max_age_hours when the latest run began, or D7 has emitted nothing for the lookback (no data alerts). Verdicts that old fail the gates. Both gauges are compared; no threshold is written here."
        labels:
          severity: high
          contact_point: discord-ops

      - uid: bar_freshness_1d_uid
        title: bar_freshness_1d
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: last_over_time(bar_integrity_failing_names{check="freshness_1d"}[36h])
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "compute_1d names with a stale canonical 1d series"
          description: "bar_integrity_failing_names is {{ $value }} for check freshness_1d in the latest D7 report: that many names' latest canonical 1d bar trails the last completed session by more than threshold.bar_integrity.freshness_max_lag_sessions_1d uncovered sessions. The phase 186 rebuild refuses them. Separate from bar_integrity_failing, which fires permanently while session_coverage fails, so a new freshness failure is not hidden under it. Expected to fire from about two sessions after the 1d swap (185-47) until 189-10 launches the fetcher timer."
        labels:
          severity: high
          contact_point: discord-ops

      - uid: ibkr_fetcher_sla_breached_uid
        title: ibkr_fetcher_sla_breached
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: last_over_time(ohlcv_coverage_sla_breached_series[36h])
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "IBKR history fetcher has series past the staleness SLA"
          description: "ohlcv_coverage_sla_breached_series is {{ $value }} at the fetcher's last run end. No data is expected while the fetcher is stopped, and todo 498 (the collector drops metrics carrying a job label) keeps this series out of Prometheus until it is fixed."
        labels:
          severity: high
          contact_point: discord-ops

      - uid: tradier_refused_uid
        title: tradier_refused
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: last_over_time(ohlcv_load_refused_24h{source='tradier'}[36h])
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Tradier loads refused or gated in the last 24 h"
          description: "ohlcv_load_refused_24h for source tradier is {{ $value }} at the latest D7 run. A refused load exits non-zero and leaves the stored bars unchanged; read ohlcv_load.detail."
        labels:
          severity: high
          contact_point: discord-ops

      - uid: revision_refused_uid
        title: revision_refused
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum(last_over_time(ohlcv_load_refused_24h{source=~'ibkr|derived'}[36h]))
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "A revision-ratio refusal on an IBKR or derived load"
          description: "ohlcv_load_refused_24h for sources ibkr and derived sums to {{ $value }} at the latest D7 run. The write contract refused a revision above threshold.bar_integrity.max_revision_ratio; read ohlcv_load.detail."
        labels:
          severity: high
          contact_point: discord-ops

  - orgId: 1
    name: IndicAgent MEDIUM Alerts
    folder: IndicAgent
    interval: 5m
    rules:

      - uid: data_completeness_soft_uid
        title: data_completeness_soft
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: bar_auditor_canonical_completeness_pct
              intervalMs: 300000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0.95]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
              type: classic_conditions
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "Data completeness below 95% soft threshold"
          description: "bar_auditor_canonical_completeness_pct < 95% for {{ $labels.symbol }}/{{ $labels.tf }}."
        labels:
          severity: medium
          contact_point: discord-ops
