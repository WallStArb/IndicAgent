# [todo 044] Tempo 3.0 removed the top-level `compactor:` block (app.Config no longer
# has that field) — compaction/retention for monolithic single-binary deployments like
# this one is now handled internally by the live-store component, no config needed.
# `backend_scheduler`/`backend_worker` replace it only in microservices-mode Tempo.
server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

reporting:
  enabled: false
