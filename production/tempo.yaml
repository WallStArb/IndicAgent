# [todo 044] Tempo 3.0 removed the top-level `compactor:` block (app.Config no longer
# has that field) — compaction/retention for monolithic single-binary deployments like
# this one is now handled internally by the live-store component, no config needed.
# `backend_scheduler`/`backend_worker` replace it only in microservices-mode Tempo.
server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# [todo 125, 2026-07-17] todo 044's fix for this same crash loop was itself wrong: it
# guessed `reporting: enabled: false` from the `-reporting.enabled` CLI flag name, but
# Tempo's actual app.Config struct (confirmed via `strings` on the compiled binary,
# grafana/tempo:3.0.0, revision d399842f5) tags this field `yaml:"usage_report,omitempty"`
# with a nested `yaml:"reporting_enabled"` -- the flag namespace doesn't mirror the YAML
# struct namespace here. Reproduced the parse failure standalone against the real binary
# before changing this, and verified this exact form starts cleanly (same method).
usage_report:
  reporting_enabled: false
