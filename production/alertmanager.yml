route:
  receiver: "default"
  group_by: ["alertname", "unit"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: "default"
    # PLACEHOLDER -- replace bot_token/chat_id with real values, then this
    # receiver goes live on the next `docker compose up -d` for alertmanager.
    # Confirmed 2026-08-13: DiskSpaceCritical fired correctly in Prometheus
    # 2h17m before a disk-full crash and never reached a human because this
    # receiver had no notification config at all -- config existed, routing
    # existed, nothing was wired to the last mile. Get a bot_token from
    # @BotFather and a chat_id by messaging the bot then checking
    # https://api.telegram.org/bot<token>/getUpdates.
    telegram_configs:
      - bot_token: "PLACEHOLDER_BOT_TOKEN"
        chat_id: 0 # PLACEHOLDER_CHAT_ID (integer, not string)
        parse_mode: "" # plain text; avoids Markdown escaping issues in alert text
        message: '{{ template "telegram.default.message" . }}'
