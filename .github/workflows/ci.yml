name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref — don't burn runner minutes on stale pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write    # dorny/test-reporter posts inline PR annotations
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Format — ruff (style + dead imports) + black (formatting)
  # Fast (~10s). Blocks test job from starting if violated.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install lint tools
        run: pip install "ruff>=0.15.0" "black>=26.1.0" "vulture>=2.11" "mypy>=1.19.0" "mypy-baseline>=0.7.4"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Vulture (dead code)
        run: vulture

      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: ${{ runner.os }}-mypy-

      # Blocking (todo 311): [tool.mypy] in pyproject.toml was real config, run
      # nowhere, for months. 803 pre-existing errors as of 2026-08-21 made a
      # bare gate unsafe (would fail every PR regardless of its own diff,
      # training people to ignore CI red) -- mypy-baseline grandfathers
      # .mypy-baseline.txt's existing errors and blocks only genuinely NEW
      # ones, same "grandfather existing, block new" shape as vulture's
      # tools/vulture_whitelist.py. Regenerate the baseline (mypy-baseline
      # sync) as pre-existing errors get cleaned up -- it should only shrink
      # over time, never grow (a growing baseline means new errors are being
      # silently absorbed into it instead of fixed).
      - name: Mypy
        run: |
          # pipefail off deliberately: mypy's own exit code is nonzero for the
          # 803 pre-existing (baselined) errors alone -- with the default
          # pipefail shell, that would fail this step regardless of what
          # mypy-baseline reports, defeating the whole point of the baseline.
          # mypy-baseline filter's own exit code (0 = no new violations, 1 =
          # new violations found) is what must gate here.
          set +o pipefail
          mypy src/ --ignore-missing-imports | mypy-baseline filter

      - name: Duplicate test names
        run: python tools/check_duplicate_tests.py

  # Alert rules: promtool check and the rule tests, in the Prometheus image docker-compose.yml pins.
  # A parallel job outside `needs`, so it never delays the test jobs (the image pull and the tests take
  # about 30 s); it still fails the push.
  alert-rules:
    name: Alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: promtool check rules and rule tests
        run: tools/check_alert_rules.sh

  # ---------------------------------------------------------------------------
  # Plugin Invariants — Renaissance-grade structural guards.
  # Mirrors all 9 bash checks in tools/pre-commit.hook (the local git hook is
  # opt-in, and --no-verify bypasses it entirely, so this job is the only one
  # that actually gates every PR/push). Checks 8/9 (glossary, counterfactual-
  # ledger) were the last two mirrored, 2026-08-21 (todo 310); they need a
  # PR-diff base rather than a full-repo scan, unlike guards 1-4.
  # No pip install needed, pure grep/find, runs in ~2s.
  # ---------------------------------------------------------------------------
  plugin-guards:
    name: Plugin Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # Full history, not the default shallow (depth-1) clone -- guards 8/9
          # below diff against the PR base / previous push commit, which a
          # shallow clone doesn't have available to diff against.
          fetch-depth: 0

      # Guards 1-4 all delegate to tools/check_plugin_invariants.sh -- the
      # single source of truth shared with tools/pre-commit.hook's local,
      # staged-files-only version of the same 4 checks. Root cause this
      # eliminates: the two used to be hand-maintained, independently-copied
      # bash regexes that drifted apart (CI's allowlist was missing 'Record'
      # and 16 other suffixes the hook already accepted) and broke every push
      # to main from 2026-08-12 through 2026-08-16. File *selection* strategy
      # legitimately differs (CI does a full-repo scan for thoroughness; the
      # hook scopes to staged files for speed) -- everything that decides
      # WHAT COUNTS AS COMPLIANT lives in the shared script exactly once.
      - name: Plugin class naming
        run: |
          find src/intelligence/ -name "*.py" | tools/check_plugin_invariants.sh class-naming

      - name: Plugin file naming
        run: |
          find src/intelligence/ -name "*.py" | tools/check_plugin_invariants.sh file-naming

      - name: I7 regime_type declaration
        run: |
          find src/intelligence/trading/ -name "*.py" | tools/check_plugin_invariants.sh regime-type

      - name: Ring 0 boundary
        run: |
          tools/check_plugin_invariants.sh ring0-boundary

      # Guard 9 needs "what changed in this PR/push", not a full-repo scan
      # (guard 8, the glossary, runs full-tree against its baseline since
      # todo 430). pull_request: the PR's base SHA. push: the commit
      # before this push (github.event.before) -- 40 zeros on a ref's first-
      # ever push, which git cat-file correctly rejects, falling back to the
      # empty tree so the diff is still well-defined (treats every file in the
      # initial push as "changed", the conservative/safe direction). The
      # step below diffs with three-dot syntax (base...HEAD, not base HEAD) --
      # code review finding: two-dot diffs against the PR base branch's
      # current tip, which can have advanced past the PR's own fork point
      # while the PR sat open, pulling in unrelated main-branch drift as if
      # it were part of the PR's own diff. Three-dot diffs against the
      # merge-base instead, matching "what did this PR actually change."
      - name: Determine diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git hash-object -t tree /dev/null)
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: Glossary enforcement
        # Full tree against the committed baseline (todo 430): no file may add a violation,
        # an unparseable glossary rule fails, and a new ban is checked everywhere at once.
        run: python3 tools/check_glossary.py --all --baseline tools/glossary_baseline.json

      # Delegates to tools/check_counterfactual_ledger.sh -- extracted from
      # pre-commit.hook's own inline bash (todo 310) into a shared script,
      # same hook/CI split as guards 1-4 above, so this check doesn't become a
      # second independently-copied regex the two call sites can drift apart
      # on (the exact failure mode check_plugin_invariants.sh's docstring
      # documents already happening once for guards 1-4).
      - name: Counterfactual-ledger enforcement
        run: |
          FILES=$(git diff --name-only --diff-filter=ACM "${{ steps.base.outputs.sha }}...HEAD" -- '*.sql' \
            | grep -E '(migrations?)/' || true)
          echo "$FILES" | tools/check_counterfactual_ledger.sh

  # ---------------------------------------------------------------------------
  # Unit Tests — 3454 tests, CI-clean (no live infra required).
  # Runs only after lint + plugin-guards pass to avoid wasting 60s on known-bad
  # commits. JUnit XML uploaded so GitHub annotates failing tests inline on PRs.
  # --durations=20: surfaces the 20 slowest tests every run (instrument everything).
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, plugin-guards]
    steps:
      # Full history: two tests resolve pinned commits (test_feature_composition_contract, the summary
      # card recipe commits) and fail, not skip, under CI=true when the clone is shallow.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      # The golden-digest tests were recorded on an AVX-512 host, where OpenBLAS (DYNAMIC_ARCH) picks its
      # SkylakeX kernel. Other kernels (Haswell, Zen, Sandybridge) sum in a different order and move the last
      # bits, so on a runner without AVX-512 these digests fail whatever the code does (verified by
      # OPENBLAS_CORETYPE locally, docs/reference/gotchas.md). GitHub's ubuntu-latest hands out either CPU.
      # The goldens are never regenerated; on a non-SkylakeX runner they are deselected with a visible
      # warning, and `repro_frozen` on the host is the determinism gate (todo 679).
      - name: Detect the OpenBLAS kernel
        id: blas
        run: |
          core=$(OPENBLAS_VERBOSE=2 python -c "import numpy as n; n.dot(n.ones((4, 4)), n.ones((4, 4)))" 2>&1 | sed -n 's/^Core: //p' | head -1 || true)
          if [ -z "$core" ]; then
            echo "::error title=BLAS kernel probe::OPENBLAS_VERBOSE=2 printed no 'Core:' line; the probe needs updating, not skipping"
            exit 1
          fi
          cpu=$(lscpu | sed -n 's/^Model name: *//p')
          echo "core=${core}" >> "$GITHUB_OUTPUT"
          echo "::notice title=BLAS kernel::${cpu}; OpenBLAS core ${core}"

      - name: Run unit tests
        env:
          BLAS_CORE: ${{ steps.blas.outputs.core }}
        run: |
          deselect=()
          if [ "$BLAS_CORE" != "SkylakeX" ] && [ "$BLAS_CORE" != "Cooperlake" ]; then
            echo "::warning title=golden digests deselected::OpenBLAS core '${BLAS_CORE}' is not SkylakeX or Cooperlake, the kernels the goldens were recorded on"
            for node in \
              tests/unit/test_null_panels.py::test_battery_panels_are_bit_identical_at_the_pinned_seeds \
              tests/unit/intelligence/test_production_path_golden.py::test_production_path_matches_its_golden_digests \
              tests/unit/intelligence/test_regime_kernel.py::test_synthetic_case_reproduces_the_writer_golden \
              tests/unit/intelligence/test_regime_kernel.py::test_kernel_output_does_not_depend_on_the_callers_blas_threads \
              tests/unit/intelligence/test_regime_kernel.py::test_two_threads_running_the_kernel_concurrently_both_match_the_golden \
              tests/unit/intelligence/test_regime_kernel.py::test_real_daily_cases_reproduce_the_writer_golden; do
              deselect+=(--deselect "$node")
            done
          fi
          pytest tests/unit/ -n auto -rs --tb=short --junit-xml=test-results.xml --durations=20 ${deselect[@]+"${deselect[@]}"}

      # The reporter below trims its summary past a size limit and logs need a login, so name the
      # failed tests as annotations (readable from the checks API) when the run is red. The same step
      # prints one notice with the skip count by reason, so tests that stop running show up.
      - name: Annotate failed tests
        if: always()
        run: |
          python tools/annotate_junit_failures.py test-results.xml
          echo "::notice title=frozen artifacts::frozen artifacts not checked in CI (the frozen-verdict tests need logs/ that CI does not have; repro_frozen on the host is the gate, todo 679)"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: pytest results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

  # ---------------------------------------------------------------------------
  # DB tests (todo 676): the tests marked for a live database skip in the unit job because CI has no
  # Postgres. This job builds the production database image (production/Dockerfile.timescaledb: TimescaleDB
  # plus pgvector), loads the dated schema baseline fixture and replays the migrations committed after it.
  # Replaying all of production/migrations on an empty database does not work (the probe of 2026-11-26: 159
  # of 605 files fail, the v2.x history assumes tables that no longer exist), so the baseline is the base.
  # A gate since 2026-11-26 (three unskipped greens, about 70 s): a failed step or test fails the job. Two
  # replay failures are tolerated by name and reason (todo 676): 575 (the baseline already holds its result)
  # and 605 (a production-data guard); any other failed migration fails the job. The unit job still
  # skips these tests (it has no database); this job is where they run.
  # ---------------------------------------------------------------------------
  db-tests:
    name: DB tests
    runs-on: ubuntu-latest
    needs: [lint, plugin-guards]
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and start the production database image
        run: |
          start=$(date +%s)
          docker build -q -t indicagent-timescaledb -f production/Dockerfile.timescaledb production
          docker run -d --name db -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=indicagent -p 5432:5432 indicagent-timescaledb
          for _ in $(seq 1 60); do pg_isready -h localhost -U postgres -d indicagent && break; sleep 2; done
          echo "::notice title=db image::build and start $(( $(date +%s) - start )) s"

      - name: Load the schema baseline and replay later migrations
        run: |
          start=$(date +%s)
          psql_run() { psql -h localhost -U postgres -d indicagent -v ON_ERROR_STOP=1 -q -f "$1" > /tmp/sql.out 2>&1; }
          # Roles the baseline and the migrations grant to (the cluster owns them in production, not the dump).
          psql -h localhost -U postgres -d indicagent -q -c "CREATE ROLE bar_derivation_writer; CREATE ROLE ohlcv_observation_writer;"
          for f in tests/integration/fixtures/schema_baseline_2026-11-05.sql tests/integration/fixtures/schema_baseline_2026-11-05_hypertables.sql; do
            psql_run "$f" || echo "::warning title=baseline failed::$(basename "$f"): $(grep -m1 -E 'ERROR|FATAL' /tmp/sql.out | cut -c1-200)"
          done
          for f in tests/integration/fixtures/seed_instruments_2026-11-05.sql tests/integration/fixtures/seed_config_2026-11-05.sql; do
            psql_run "$f" || echo "::warning title=seed failed::$(basename "$f"): $(grep -m1 -E 'ERROR|FATAL' /tmp/sql.out | cut -c1-200)"
          done
          tolerated="575_feature_ic_scores_one_name.sql 605_universe_membership_reset_for_rebuild.sql"
          failed=0
          unexpected=0
          count=0
          for f in $(ls production/migrations/*.sql | sort); do
            n=$(basename "$f" | cut -d_ -f1 | sed 's/^0*//')
            [ "$n" -ge 560 ] || continue
            count=$((count + 1))
            if ! psql_run "$f"; then
              failed=$((failed + 1))
              case " $tolerated " in
                *" $(basename "$f") "*) level=warning ;;
                *) level=error; unexpected=$((unexpected + 1)) ;;
              esac
              echo "::${level} title=migration failed::$(basename "$f"): $(grep -m1 -E 'ERROR|FATAL' /tmp/sql.out | cut -c1-200)"
            fi
          done
          echo "::notice title=baseline and replay::${count} migrations replayed, ${failed} failed (${unexpected} unexpected), $(( $(date +%s) - start )) s"
          [ "$unexpected" -eq 0 ]

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r requirements.txt

      - name: Run the live-DB tests
        run: |
          start=$(date +%s)
          rc=0
          pytest -rsf --tb=short \
            tests/unit/test_bar_source_policy_retirement.py \
            tests/unit/core/test_resource_lease.py \
            tests/unit/services/test_bar_derivation_stage_lock.py \
            tests/unit/services/test_bar_derivation_policy_change_sql.py \
            tests/unit/scripts/test_fetcher_lock.py \
            tests/unit/services/test_ohlcv_raw_bulk_live.py \
            tests/unit/test_canonical_bar_lineage_massive_migration_contract.py \
            > /tmp/dbtests.out 2>&1 || rc=$?
          tail -40 /tmp/dbtests.out
          grep -E '^(FAILED|ERROR)' /tmp/dbtests.out | head -10 | while read -r line; do echo "::error title=live-DB test::${line:0:230}"; done || true
          echo "::notice title=live-DB tests::$(tail -1 /tmp/dbtests.out) in $(( $(date +%s) - start )) s"
          exit "$rc"
