name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref — don't burn runner minutes on stale pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write    # dorny/test-reporter posts inline PR annotations
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Format — ruff (style + dead imports) + black (formatting)
  # Fast (~10s). Blocks test job from starting if violated.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install lint tools
        run: pip install "ruff>=0.15.0" "black>=26.1.0" "vulture>=2.11" "mypy>=1.14.0"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Vulture (dead code)
        run: vulture

      # Report-only: [tool.mypy] in pyproject.toml is real config but 795
      # pre-existing errors as of 2026-08-14 make this unsafe to block on
      # without a baseline/suppression mechanism first — see todo 311.
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: ${{ runner.os }}-mypy-

      - name: Mypy (report-only)
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true

      - name: Duplicate test names
        run: python tools/check_duplicate_tests.py

  # ---------------------------------------------------------------------------
  # Plugin Invariants — Renaissance-grade structural guards.
  # Mirrors 4 of the 9 bash checks in tools/pre-commit.hook (the local git hook
  # is opt-in and --no-verify bypasses it entirely — this job is the only one
  # that actually gates every PR/push). Glossary + counterfactual-ledger checks
  # Checks 8/9 (glossary, counterfactual-ledger) mirrored 2026-08-21 (todo 310) --
  # both need a PR-diff base rather than a full-repo scan, unlike guards 1-4.
  # No pip install needed — pure grep/find, runs in ~2s.
  # ---------------------------------------------------------------------------
  plugin-guards:
    name: Plugin Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # Full history, not the default shallow (depth-1) clone -- guards 8/9
          # below diff against the PR base / previous push commit, which a
          # shallow clone doesn't have available to diff against.
          fetch-depth: 0

      # Guards 1-4 all delegate to tools/check_plugin_invariants.sh -- the
      # single source of truth shared with tools/pre-commit.hook's local,
      # staged-files-only version of the same 4 checks. Root cause this
      # eliminates: the two used to be hand-maintained, independently-copied
      # bash regexes that drifted apart (CI's allowlist was missing 'Record'
      # and 16 other suffixes the hook already accepted) and broke every push
      # to main from 2026-08-12 through 2026-08-16. File *selection* strategy
      # legitimately differs (CI does a full-repo scan for thoroughness; the
      # hook scopes to staged files for speed) -- everything that decides
      # WHAT COUNTS AS COMPLIANT lives in the shared script exactly once.
      - name: Plugin class naming
        run: |
          find src/intelligence/ -name "*.py" | tools/check_plugin_invariants.sh class-naming

      - name: Plugin file naming
        run: |
          find src/intelligence/ -name "*.py" | tools/check_plugin_invariants.sh file-naming

      - name: I7 regime_type declaration
        run: |
          find src/intelligence/trading/ -name "*.py" | tools/check_plugin_invariants.sh regime-type

      - name: Ring 0 boundary
        run: |
          tools/check_plugin_invariants.sh ring0-boundary

      # Guards 8-9 need "what changed in this PR/push", not a full-repo scan --
      # a single shared base commit, computed once, so both steps diff against
      # the same point. pull_request: the PR's base SHA. push: the commit
      # before this push (github.event.before) -- 40 zeros on a ref's first-
      # ever push, which git cat-file correctly rejects, falling back to the
      # empty tree so the diff is still well-defined (treats every file in the
      # initial push as "changed", the conservative/safe direction).
      - name: Determine diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git hash-object -t tree /dev/null)
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      # tools/check_glossary.py is already the single source of truth the hook
      # calls too -- no extraction needed, just the same script with a
      # PR-diff-computed file list instead of the hook's staged-files list.
      - name: Glossary enforcement
        run: |
          FILES=$(git diff --name-only --diff-filter=ACM "${{ steps.base.outputs.sha }}" HEAD -- '*.py' '*.md' \
            | grep -vE '^docs/(ideas|plans)/archive/' || true)
          if [ -z "$FILES" ]; then
            echo "OK: no Python or Markdown files changed"
            exit 0
          fi
          python3 tools/check_glossary.py $FILES

      # Delegates to tools/check_counterfactual_ledger.sh -- extracted from
      # pre-commit.hook's own inline bash (todo 310) into a shared script,
      # same hook/CI split as guards 1-4 above, so this check doesn't become a
      # second independently-copied regex the two call sites can drift apart
      # on (the exact failure mode check_plugin_invariants.sh's docstring
      # documents already happening once for guards 1-4).
      - name: Counterfactual-ledger enforcement
        run: |
          FILES=$(git diff --name-only --diff-filter=ACM "${{ steps.base.outputs.sha }}" HEAD -- '*.sql' \
            | grep -E '(migrations?)/' || true)
          echo "$FILES" | tools/check_counterfactual_ledger.sh

  # ---------------------------------------------------------------------------
  # Unit Tests — 3454 tests, CI-clean (no live infra required).
  # Runs only after lint + plugin-guards pass to avoid wasting 60s on known-bad
  # commits. JUnit XML uploaded so GitHub annotates failing tests inline on PRs.
  # --durations=20: surfaces the 20 slowest tests every run (instrument everything).
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, plugin-guards]
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ --tb=short --junit-xml=test-results.xml --durations=20

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: pytest results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false
