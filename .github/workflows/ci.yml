name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref — don't burn runner minutes on stale pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write    # dorny/test-reporter posts inline PR annotations
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Format — ruff (style + dead imports) + black (formatting)
  # Fast (~10s). Blocks test job from starting if violated.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install lint tools
        run: pip install "ruff>=0.15.0" "black>=26.1.0" "vulture>=2.11" "mypy>=1.14.0"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Vulture (dead code)
        run: vulture

      # Report-only: [tool.mypy] in pyproject.toml is real config but 795
      # pre-existing errors as of 2026-08-14 make this unsafe to block on
      # without a baseline/suppression mechanism first — see todo 311.
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: ${{ runner.os }}-mypy-

      - name: Mypy (report-only)
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true

      - name: Duplicate test names
        run: python tools/check_duplicate_tests.py

  # ---------------------------------------------------------------------------
  # Plugin Invariants — Renaissance-grade structural guards.
  # Mirrors 4 of the 9 bash checks in tools/pre-commit.hook (the local git hook
  # is opt-in and --no-verify bypasses it entirely — this job is the only one
  # that actually gates every PR/push). Glossary + counterfactual-ledger checks
  # (hook checks 8/9) are not mirrored here yet — same gap, tracked as todo 310.
  # No pip install needed — pure grep/find, runs in ~2s.
  # ---------------------------------------------------------------------------
  plugin-guards:
    name: Plugin Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      # Guard 1: plugin classes must end with an approved suffix.
      # Scope: plugin dirs only (plugins/, features/, trading/).
      # Infrastructure dirs (pipeline/, metrics/, services/, ai/, swarm/) excluded by scope.
      - name: Plugin class naming
        run: |
          violations=$(grep -rn '^class [A-Z]' \
            src/intelligence/plugins/ \
            src/intelligence/features/ \
            src/intelligence/trading/ \
            --include="*.py" \
            --exclude=schemas.py \
            --exclude=alpha_multiplier.py \
            --exclude=dag.py \
            --exclude=position_sizer.py | \
            grep -vE 'class.*(Plugin|Mixin|Agent|Test|Data|Protocol|Enum|Error|Exception|Config|Result|State|Score|Frame|Entry|Event|Spec|Type|Info|Registry|Manager|Builder|Handler|Tracker|Scorer|Aggregat|Transition|Monitor|Stage|Runner|Client|Service|Target|Profile|Weight|Provider|Chain|Candidate)\b' \
            || true)
          if [ -n "$violations" ]; then
            echo "FAIL: plugin class naming violations (rename to end with 'Plugin'):"
            echo "$violations"
            exit 1
          fi
          echo "OK: all plugin classes follow naming convention"

      # Guard 2: all files in src/intelligence/ must use snake_case.py naming.
      - name: Plugin file naming
        run: |
          violations=$(find src/intelligence/ -name "*.py" \
            ! -name "__init__.py" \
            ! -name "conftest.py" \
            ! -name "TEMPLATE_agent.py" \
            ! -name "TEMPLATE.py" | \
            while read -r f; do
              filename=$(basename "$f")
              echo "$filename" | grep -qE '^[a-z][a-z0-9_]*\.py$' || echo "  $f"
            done || true)
          if [ -n "$violations" ]; then
            echo "FAIL: plugin file naming violations (rename to snake_case.py):"
            echo "$violations"
            exit 1
          fi
          echo "OK: all plugin files use snake_case naming"

      # Guard 3: every I7 trading plugin must declare regime_type.
      # Missing this causes the regime gate to silently misfire in production.
      - name: I7 regime_type declaration
        run: |
          infra="signal_ledger.py lifecycle_tracker.py trade_framer.py signal_aggregator.py cis_scorer.py weight_updater.py confidence_calibrator.py __init__.py"
          violations=""
          for f in src/intelligence/trading/*.py; do
            filename=$(basename "$f")
            is_infra=false
            for i in $infra; do [ "$filename" = "$i" ] && is_infra=true && break; done
            $is_infra && continue
            if grep -q '^class.*Plugin' "$f" 2>/dev/null; then
              grep -qE 'regime_type[[:space:]]*[:=]' "$f" || violations="$violations\n  $f"
            fi
          done
          if [ -n "$violations" ]; then
            echo "FAIL: I7 plugins missing regime_type declaration:"
            printf "$violations\n"
            echo "Fix: add 'regime_type: ClassVar[str] = \"trend\" | \"mean_reversion\" | \"any\"'"
            exit 1
          fi
          echo "OK: all I7 plugins declare regime_type"

      # Guard 4: Ring 0 boundary — src/core/ and src/observability/ (portable
      # infrastructure, CLAUDE.md's Ring rule) must never import domain code
      # (src/intelligence/, src/providers/, src/self_healing/, services/).
      # Mirrors tools/pre-commit.hook's check_ring0_boundary exactly.
      - name: Ring 0 boundary
        run: |
          violations=$(grep -rn \
            "from src\.intelligence\|from src\.providers\|from src\.self_healing\|from services" \
            src/core/ src/observability/ --include="*.py" 2>/dev/null \
            | grep -v "^\s*#" | grep -v "ring0-ok" || true)
          if [ -n "$violations" ]; then
            echo "FAIL: Ring 0 boundary violation — src/core/ or src/observability/ imports domain layer"
            echo "$violations"
            echo "Remediation: move the file to Ring 1 (src/intelligence/) or add a ring0-ok comment for lazy imports"
            exit 1
          fi
          echo "OK: Ring 0 boundary clean"

  # ---------------------------------------------------------------------------
  # Unit Tests — 3454 tests, CI-clean (no live infra required).
  # Runs only after lint + plugin-guards pass to avoid wasting 60s on known-bad
  # commits. JUnit XML uploaded so GitHub annotates failing tests inline on PRs.
  # --durations=20: surfaces the 20 slowest tests every run (instrument everything).
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, plugin-guards]
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ --tb=short --junit-xml=test-results.xml --durations=20

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: pytest results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false
