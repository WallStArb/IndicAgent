# Family 9, 52-week-high anchoring (ledger E26, George and Hwang 2004; todo 653).
# Pre-registration: docs/plans/2026-11-15-family9-52week-high-prereg-draft.md (sections 2-6), with the
# pre-build rulings of ledger 2026-11-23d (NaN outside dividend coverage, no price-only fallback).
# This file is the machine form of that pre-registration, recorded 2026-11-23 before any real-data
# number. Editing any value after a real run is a new spec hash, a new recorded run and a
# methodology change. This is the primary panel; the core panel is family9_high_anchor_h5_core.yaml.
# Dates are quoted and floats carry a decimal point: the loader is strict (spec.py).
kind: family
family: family9_high_anchor
prior_source: docs/plans/2026-11-15-family9-52week-high-prereg-draft.md
horizon: 5  # prereg 4: row d signal, enter at d+1's open, exit at d+6's open
factor_spec: vintage_1  # prereg 4: S1 vintage 1 on the members' universe
panel:
  universe: universe_membership  # the stage 2 point-in-time membership
  universe_exclusion: seen_names  # the screen's names and the cross-asset set, a pinned holdout (daily residual prereg B1)
  tf: "1d"
  bars_per_session: 1
  start: "2005-01-03"  # the NYSE calendar starts 2005-01-01 (daily residual prereg 10)
  end_exclusive: "2025-12-24"  # alpha.validation.oos_start; the forward span is never read
  total_return: {suspect_yield: 0.10}  # prereg 3: total-return closes (todo 428); NaN outside dividend coverage (ledger 2026-11-23d)
members:  # prereg 3; declared memory = slot history + S1's 252 + 21 sessions = 525
  - name: high_distance_252  # F1: (c[d] - max(c[d-251..d])) / max(c[d-251..d]), NaN below 240 finite closes of 252, sign +1
    signal: src.intelligence.research.families.high_anchor.high_distance_member
    panel_source: close  # the panel's total-return close, not the S1 residual returns (todo 653)
    params: {window: 252, min_finite: 240}  # pinned, never swept (prereg 3, ledger 2026-11-23d point 4)
    slot_history_sessions: 252
    declared_memory_rows: 525
construction:  # prereg 4, R1
  name: rank_vol_neutral
  direction: 1  # the member's sign is applied inside it (prereg 3)
  coverage_floor: 20
  vol_window_sessions: 60  # prereg 4: 60 sessions of residuals, at least half finite
  vol_min_finite_fraction: 0.5
scoring:
  timing_statistic: e17  # methodology-change-ledger E17 incl. the 2026-10-27 amendment (L = memory + h)
  session_scoring: true  # one P&L per session
  trading_start: "2007-03-01"  # prereg 4: the first row with the 525-session memory (as the momentum members)
  sub_periods:  # reported, not voted on
    - ["2007-03-01", "2011-12-31"]
    - ["2012-01-01", "2018-12-31"]
    - ["2019-01-01", "2025-12-23"]
  min_shift: 63
  bootstrap_mean_block: 21
  bootstrap_reps: 2000
  seed: 183
  warmup_sessions: 252
  calibration_refit_sessions: 21
  coverage_fraction: 0.95
  ridge_epsilon_fraction: 0.10
  mv_condition_max: 1000.0
  ic_shrinkage_k: 100.0
guards:
  seed: 183
  n_random: 4
  max_rows: 12
  s1_probe_sessions: 330
costs:  # diagnostics only, never a gate (prereg 4)
  bps_low: 1.0
  bps_high: 5.0
