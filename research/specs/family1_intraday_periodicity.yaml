# Family 1: cross-sectional intraday periodicity. Pre-registration:
# docs/plans/2026-09-25-family1-intraday-periodicity-prereg.md (sections 2-5).
# This file is the machine form of that pre-registration. Editing any value after a real run is
# a new spec hash, a new recorded run and, per the prereg, a methodology change.
# Dates are quoted and floats carry a decimal point: the loader is strict (spec.py).
kind: family
family: intraday_periodicity
prior_source: docs/plans/2026-09-25-family1-intraday-periodicity-prereg.md
horizon: 2  # prereg 4: enter at the slot's first open, exit at the next slot's open (2 bars)
factor_spec: vintage_1  # prereg 2: S1 vintage-1 spec as merged, per-slot market loadings
panel:
  universe: compute_eligible  # prereg 2: 233 names
  tf: "15m"
  bars_per_session: 26  # 13 half-hour slots
  start: "2006-01-01"  # history before the scored span feeds S1's trailing windows
  # Read as UTC midnight, so the panel ends before oos_start 2025-12-24T05:15Z.
  end_exclusive: "2025-12-24"
members:  # prereg 3; declared memory = (slot history + 252 + 21 sessions) x 26 rows
  - name: same_slot_lag1
    signal: src.intelligence.research.families.intraday_periodicity.same_slot_mean
    params: {window_sessions: 1}
    slot_history_sessions: 1
    declared_memory_rows: 7124
  - name: same_slot_mean5
    signal: src.intelligence.research.families.intraday_periodicity.same_slot_mean
    params: {window_sessions: 5}
    slot_history_sessions: 5
    declared_memory_rows: 7228
  - name: same_slot_mean20
    signal: src.intelligence.research.families.intraday_periodicity.same_slot_mean
    params: {window_sessions: 20}
    slot_history_sessions: 20
    declared_memory_rows: 7618
  - name: same_slot_mean40
    signal: src.intelligence.research.families.intraday_periodicity.same_slot_mean
    params: {window_sessions: 40}
    slot_history_sessions: 40
    declared_memory_rows: 8138
construction:  # prereg 4, R1
  name: rank_vol_neutral
  direction: 1  # continuation
  coverage_floor: 20  # prereg 3
  # Not pinned by the prereg (D-24 requires a pinned window): about one month of residual bar
  # returns, long enough for a stable per-name scale, short enough to track regime changes.
  vol_window_sessions: 20
  vol_min_finite_fraction: 0.5
scoring:
  session_scoring: true  # prereg 4, R2: daily P&L, 252 per year
  trading_start: "2010-01-04"  # prereg 2: scored span 2010-01-04 through 2025-12-23
  sub_periods:  # reported, not voted on
    - ["2010-01-04", "2014-12-31"]
    - ["2015-01-01", "2019-12-31"]
    - ["2020-01-01", "2025-12-23"]
  min_shift: 63  # sessions; phase 179's value, not pinned by the prereg
  bootstrap_mean_block: 21
  bootstrap_reps: 2000
  seed: 183
  # The six below only feed evaluate()'s covariance plan, which R1 ignores; pinned because
  # evaluate() always builds the plan.
  warmup_sessions: 252
  calibration_refit_sessions: 21
  coverage_fraction: 0.95
  ridge_epsilon_fraction: 0.10
  mv_condition_max: 1000.0
  ic_shrinkage_k: 100.0
guards:  # probe sizes bound the S3 cost on the full panel (D-25)
  seed: 183
  n_random: 4
  max_rows: 12
  s1_probe_sessions: 330
costs:  # diagnostics only, never a gate: large-cap and ETF half-spread range, per side
  bps_low: 1.0
  bps_high: 5.0
