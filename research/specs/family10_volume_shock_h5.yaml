# Family 10 volume shock members on the daily clock (ledger family 10, E24, todo 663).
# Pre-registration: docs/plans/2026-11-15-family10-volume-shock-prereg-draft.md (sections 3-5).
# Pre-build rulings 2026-11-22e (V2 rank floor 37 of 46), 2026-11-22h (the orthogonalization fit runs
# over members only) and 2026-11-23e (members, floors and the gate 5 amendment), all before any
# real-data number. This file is the machine form of that pre-registration. Editing any value after
# a real run is a new spec hash, a new recorded run and, per the prereg, a methodology change.
# Dates are quoted and floats carry a decimal point: the loader is strict (spec.py).
kind: family
family: family10_volume_shock
prior_source: docs/plans/2026-11-15-family10-volume-shock-prereg-draft.md
horizon: 5  # prereg 4: row d signal, enter at d+1's open, exit at d+6's open
factor_spec: vintage_1  # prereg 4: S1 vintage 1 on the members' universe
panel:
  universe: universe_membership  # prereg 4: the stage 2 point-in-time membership (core: family10_volume_shock_h5_core.yaml)
  universe_exclusion: seen_names  # prereg 4: the 231-name seen-set holdout (corpus daily IC read volume_z and rel_volume)
  tf: "1d"
  bars_per_session: 1
  start: "2005-01-03"  # the NYSE calendar starts 2005-01-01
  end_exclusive: "2025-12-24"  # alpha.validation.oos_start; the forward span is never read
  total_return: {suspect_yield: 0.10}  # the S1 target is total return (todo 428); the members read volume
members:  # prereg 3; declared memory = slot history 50 + S1's 252 + 21 sessions
  - name: volume_shock_1_50
    signal: src.intelligence.research.families.volume_shock.volume_rank_member
    params: {window: 50, short: 1, min_finite: 40, min_finite_short: 40}
    slot_history_sessions: 50
    declared_memory_rows: 323
    panel_source: volume
    orthogonalize: {sum_sessions: 1, min_names: 200}
  - name: volume_shock_5_50
    signal: src.intelligence.research.families.volume_shock.volume_rank_member
    params: {window: 50, short: 5, min_finite: 40, min_finite_short: 37}
    slot_history_sessions: 50
    declared_memory_rows: 323
    panel_source: volume
    orthogonalize: {sum_sessions: 5, min_names: 200}
construction:  # prereg 4, R1
  name: rank_vol_neutral
  direction: 1  # member signs are applied inside each member (prereg 3)
  coverage_floor: 20
  vol_window_sessions: 60  # 60 sessions of residuals, at least half finite
  vol_min_finite_fraction: 0.5
scoring:
  timing_statistic: e17  # methodology-change-ledger E17 incl. the 2026-10-27 amendment (L = memory + h)
  session_scoring: true  # one P&L per session
  trading_start: "2007-03-01"  # prereg 4: the scored span starts 2007-03-01
  sub_periods:  # prereg 4: reported, not voted on
    - ["2007-03-01", "2011-12-31"]
    - ["2012-01-01", "2018-12-31"]
    - ["2019-01-01", "2025-12-23"]
  min_shift: 63
  bootstrap_mean_block: 21
  bootstrap_reps: 2000
  seed: 183
  warmup_sessions: 252
  calibration_refit_sessions: 21
  coverage_fraction: 0.95
  ridge_epsilon_fraction: 0.10
  mv_condition_max: 1000.0
  ic_shrinkage_k: 100.0
guards:
  seed: 183
  n_random: 4
  max_rows: 12
  s1_probe_sessions: 330
costs:  # diagnostics only, never a gate (prereg 4)
  bps_low: 1.0
  bps_high: 5.0
