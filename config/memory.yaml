# Agent Memory Subsystem Configuration — Phase 097
#
# These values are read by MemoryClient at construction time (Wave 2 Plan 05).
# Changes take effect on next service restart (no hot-reload per Phase 097 scope).
#
# Decision traceability:
#   epoch_decay          — D-19 / D-23: prior epoch weight; epoch-2+ = epoch_decay^2 = 0.09
#   recall_limit         — D-11 / D-23: top-N after epoch-weighted rerank
#   over_fetch_multiplier — D-23: HNSW over-fetch factor; limit * 3 then Python rerank
#   hnsw_ef_search       — D-11: ef_search SET per session before HNSW query (default 40 gives poor recall)
#   timeout_ms           — D-13 / D-19: hard read timeout; 10ms margin under 50ms agent budget
#   queue_maxsize        — D-13: bounded asyncio.Queue for fire-and-forget episode writes

# Epoch decay weight applied to episodes from prior epochs during rerank.
# Current epoch weight = 1.0; epoch-1 weight = 0.3; epoch-2+ weight = 0.09.
# Configurable at MemoryClient construction — lower values bias heavily toward
# current-epoch episodes; higher values preserve cross-epoch signal.
epoch_decay: 0.3

# Maximum episodes returned by MemoryClient.recall() after epoch-weighted rerank.
# EpisodicBackend fetches recall_limit * over_fetch_multiplier from HNSW,
# applies epoch weights in Python, returns top recall_limit.
recall_limit: 10

# HNSW over-fetch multiplier (D-23). EpisodicBackend fetches this many times
# recall_limit from the index before Python-side epoch-weighted rerank.
# Intentional — pgvector HNSW does not natively support weighted distance.
over_fetch_multiplier: 3

# HNSW ef_search parameter (D-11). MemoryClient sets this per session via
# "SET hnsw.ef_search = <value>" before any HNSW query. The pgvector default
# of 40 gives poor recall at production episode volumes (thousands of rows).
hnsw_ef_search: 100

# Hard timeout in milliseconds for all MemoryClient read operations (D-13 / D-19).
# Set 10ms below the 50ms agent budget to leave headroom for context assembly.
# On timeout, MemoryClient returns [] or None — never raises, never blocks signal pipeline.
timeout_ms: 40

# Bounded asyncio.Queue depth for MemoryEpisodeWriter background drain (D-13).
# Write failures are silently dropped when the queue is full — the live signal
# pipeline is never blocked or errored by memory write saturation.
queue_maxsize: 500
