              - paragraph [ref=e62]: Synthesis
              - paragraph [ref=e63]: Every layer. Every bar.
              - paragraph [ref=e64]: Indicators, composite events, structure, regime context — computed in dependency order, in a single in-process pass. No polling, no shortcuts.
            - generic [ref=e67]:
              - paragraph [ref=e69]: "03"
              - paragraph [ref=e70]: Convergence Gate
              - paragraph [ref=e71]: Most signals die here.
              - paragraph [ref=e72]: Six independent evidence buckets — Trend, Momentum, Structure, Pattern, Institutional, Regime — must converge. 3 of 6 required. Score threshold enforced. One strong bucket can't override the rest.
            - generic [ref=e75]:
              - paragraph [ref=e76]: "04"
              - paragraph [ref=e77]: AI Interrogation
              - paragraph [ref=e78]: Survivors get challenged.
              - paragraph [ref=e79]: "Four agents attack each signal before it's published: Skeptic, Correlation, Regime Coherence, Counterfactual. The goal is to find reasons it's wrong."
            - generic [ref=e82]:
              - paragraph [ref=e83]: "05"
              - paragraph [ref=e84]: Actionable Signal
              - paragraph [ref=e85]: Entry. Thesis. Evidence.
              - paragraph [ref=e86]: Entry, target, stop, regime context, narrative rationale, confidence score. You know why the signal exists and what would have to change for it to fail.
        - generic [ref=e88]:
          - generic [ref=e90]:
            - paragraph [ref=e91]: AI Swarm
            - heading "Adversarial Interrogation" [level=2] [ref=e92]
          - paragraph [ref=e94]: Before a signal reaches you, four agents attack it. Each has a specific challenge. The goal isn't narrative generation — it's adversarial interrogation. Survivors carry a full case.
          - generic [ref=e95]:
            - generic [ref=e96]:
              - paragraph [ref=e99]: Skeptic
              - paragraph [ref=e100]: Finds the strongest case for why this setup fails.
              - paragraph [ref=e101]: Attacks the entry thesis directly — checks for overextension, adverse regime conditions, recent failure modes for this setup type, and evidence the move is already over.
            - generic [ref=e102]:
              - paragraph [ref=e105]: Correlation
              - paragraph [ref=e106]: Checks whether macro context supports the thesis.
              - paragraph [ref=e107]: Cross-asset consistency check — does DXY direction, yield curve posture, VIX regime, and correlated instrument behavior align with the directional call? Contradictions are flagged.
            - generic [ref=e108]:
              - paragraph [ref=e111]: Regime Coherence
              - paragraph [ref=e112]: Asks if the market regime is right for this setup type.
              - paragraph [ref=e113]: Trend setups in ranging regimes and mean-reversion setups in strong trends are structurally misaligned. This agent validates HMM regime, session context, and volatility posture match the setup's required conditions.
            - generic [ref=e114]:
              - paragraph [ref=e117]: Counterfactual
              - paragraph [ref=e118]: What would have to be true for this to be wrong?
              - paragraph [ref=e119]: Constructs the conditions under which the signal fails — specific price levels, regime shifts, catalyst events — so you enter with a falsification condition, not just a target.
          - generic [ref=e120]:
            - paragraph [ref=e121]: Sample output
            - generic [ref=e122]: "Bullish 5m ES setup: trend-regime aligned, SMC confluence confirmed. FVG entry zone 5236–5238, target 5258 (R2.3), stop 5229. Skeptic: no structural concern. Correlation: DXY soft, supportive. Regime coherence: HMM trend-mode, session in NY overlap — valid. Counterfactual: invalidated below 5229 or on VIX spike > 18."
          - generic [ref=e124]:
            - paragraph [ref=e125]: eAI · Evolutionary AI
            - heading "Agents That Evolve" [level=2] [ref=e126]
          - paragraph [ref=e128]: The swarm isn't static. eAI breeds new agents through evolutionary operators — each generation searching for alpha the current swarm doesn't see. Agents that prove edge get promoted. Agents that don't get demoted. The population evolves.
          - generic [ref=e129]:
            - generic [ref=e130]:
              - paragraph [ref=e133]: Agent Genome
              - paragraph [ref=e134]: Every agent carries a genome — a prompt and configuration parameter set that defines its behavior. The genome is what evolves. Agents aren't hand-tuned; they're bred.
            - generic [ref=e135]:
              - paragraph [ref=e138]: Breeding
              - paragraph [ref=e139]: "Three reproductive operators generate candidates: random mutation for exploration, recombination to combine fit parents, and LLM-directed mutation for targeted search. Each generation searches for alpha the current swarm doesn't see."
            - generic [ref=e140]:
              - paragraph [ref=e143]: Death & Failure Archive
              - paragraph [ref=e144]: Agents that don't prove edge are demoted. Failures aren't discarded — they're frozen in a gene bank. Failed genomes encode what doesn't work, preventing the population from rediscovering dead ends.
            - generic [ref=e145]:
              - paragraph [ref=e148]: Promotion
              - paragraph [ref=e149]: "New agents start in shadow mode, invisible to production. Promotion requires statistical proof: n ≥ 100 signals, positive expected PnL at the lower confidence bound. The bar is high by design."
