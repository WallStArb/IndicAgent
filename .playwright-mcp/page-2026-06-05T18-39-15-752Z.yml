            - heading "Platform Design" [level=2] [ref=e248]
          - generic [ref=e250]:
            - generic [ref=e251]:
              - generic [ref=e252]:
                - paragraph [ref=e253]: Event-Native Architecture
                - paragraph [ref=e254]: Decoupled by Design
              - paragraph [ref=e255]: Every stage publishes to a durable stream and consumes from it. Producers and consumers never call each other directly. A new subscriber — alert engine, execution system, ML scorer — connects to existing streams without touching the producers. Extension is additive.
            - generic [ref=e256]:
              - generic [ref=e257]:
                - paragraph [ref=e258]: Signal Lifecycle Tracking
                - paragraph [ref=e259]: 8-Class Outcome Model
              - paragraph [ref=e260]: Every signal is a hypothesis. The system tracks it from emission through activation and exit, recording MAE, MFE, bars-in-trade, and outcome class. Eight outcome labels — from never_activated to target_full — create a labeled training set from every market move.
            - generic [ref=e261]:
              - generic [ref=e262]:
                - paragraph [ref=e263]: Regime Context
                - paragraph [ref=e264]: Multi-Model Consensus
              - paragraph [ref=e265]: HMM state detection, GARCH volatility modeling, Kalman trend filtering, and VIX regime classification run on every bar. Setup plugins declare a regime type; the aggregator suppresses misaligned setups before anything reaches the convergence gate.
            - generic [ref=e266]:
              - generic [ref=e267]:
                - paragraph [ref=e268]: Self-Optimizing Feedback Loop
                - paragraph [ref=e269]: Evidence-Gated Weights
              - paragraph [ref=e270]: Outcome data writes back. Setup performance multipliers update from verified PnL and Sharpe roll-ups once 30+ samples are available. The pipeline improves from its own track record — no manual tuning required.
            - generic [ref=e271]:
              - generic [ref=e272]:
                - paragraph [ref=e273]: Full Audit Trail
                - paragraph [ref=e274]: Nothing Is a Black Box
              - paragraph [ref=e275]: Every LLM call, every signal emission, every outcome is logged with full context — agent ID, prompt version, parse rate, token burn, latency. Adaptive routing promotes models that demonstrate statistical edge. The system is inspectable at every layer.
            - generic [ref=e276]:
              - generic [ref=e277]:
                - paragraph [ref=e278]: Feature Store
                - paragraph [ref=e279]: Ground-Truth Persistence
              - paragraph [ref=e280]: Every bar’s full feature vector is written to a TimescaleDB hypertable — all 132 plugin outputs, tagged with the weight version that produced them. Signal outcomes JOIN back to their originating feature vector. The history is queryable and replayable.
        - generic [ref=e282]:
