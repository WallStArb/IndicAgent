            - paragraph [ref=e285]: Architecture
            - heading "Engineering Principles" [level=2] [ref=e286]
          - generic [ref=e288]:
            - generic [ref=e289]:
              - generic [ref=e290]:
                - generic [ref=e291]: "01"
                - generic [ref=e292]:
                  - heading "Dependency-Ordered Execution" [level=3] [ref=e293]
                  - paragraph [ref=e294]: DAG · Topological sort · No polling
              - paragraph [ref=e295]: Every plugin declares its inputs. The engine runs Kahn's topological sort at startup. Execution order is a mathematical property of the dependency graph, not a convention anyone maintains. Cycles hard-crash at startup. Silent corruption is impossible. Adding a plugin means declaring its dependencies; ordering is inferred.
            - generic [ref=e296]:
              - generic [ref=e297]:
                - generic [ref=e298]: "02"
                - generic [ref=e299]:
                  - heading "Regimented Signal Validation" [level=3] [ref=e300]
                  - paragraph [ref=e301]: CIS · 6-bucket convergence gate · Evidence required
              - paragraph [ref=e302]: "When 5–8 setup plugins fire on the same bar, CIS decides what gets published and whether anything does. Six buckets (Trend, Momentum, Structure, Pattern, Institutional, Regime) must converge: score > ±0.35 AND 3 of 6 must agree on direction. One dominant bucket cannot override the rest. Discipline enforced by the architecture, not by policy."
            - generic [ref=e303]:
              - generic [ref=e304]:
                - generic [ref=e305]: "03"
                - generic [ref=e306]:
                  - heading "Data as Ground Truth" [level=3] [ref=e307]
                  - paragraph [ref=e308]: Feature store · Outcome tracing · Self-improving
              - paragraph [ref=e309]: Every signal is tagged with the weight version that produced it. Every outcome (stop hit, target reached, TTL expired) is written back to the feature store with the full signal vector. Nothing is dropped. When outcome data is sufficient, weights update from evidence. The pipeline captures what it produces and learns from what it captured.
            - generic [ref=e310]:
              - generic [ref=e311]:
                - generic [ref=e312]: "04"
                - generic [ref=e313]:
                  - heading "Canonical Typed Vocabulary" [level=3] [ref=e314]
                  - paragraph [ref=e315]: IntelligenceEvent schema · Stream-native · API-first
              - paragraph [ref=e316]: Every output at every tier is encoded into a versioned IntelligenceEvent schema and published to the stream bus. Producers publish. Consumers subscribe. No service calls another directly. A new consumer (alert engine, execution system, ML scorer) subscribes to the existing stream without changing the producers. The bus is the API. Extension is additive.
            - generic [ref=e317]:
              - generic [ref=e318]:
                - generic [ref=e319]: "05"
                - generic [ref=e320]:
                  - heading "Shadow-First Governance" [level=3] [ref=e321]
                  - paragraph [ref=e322]: Shadow registry · Statistical gate · No silent corruption
              - paragraph [ref=e323]: "Every new plugin and agent enters shadow mode at startup — outputs are computed and logged but carry zero production influence. Promotion requires statistical proof: n ≥ 100 signals and a positive bootstrapped CI lower bound on P&L. Demotion is automatic when edge decays. New code cannot corrupt live signals by default; influence must be earned from evidence."
            - generic [ref=e324]:
              - generic [ref=e325]:
                - generic [ref=e326]: "06"
                - generic [ref=e327]:
                  - heading "Compute Ignorant of Persistence" [level=3] [ref=e328]
                  - paragraph [ref=e329]: DB-ignorant compute · Hot path isolation · Kafka as sink
              - paragraph [ref=e330]: Compute agents have no database access — by design, not by convention. I1–I7 runs entirely in-memory and publishes to Kafka. WriterAgents consume from Kafka and own all DB writes. When the database slows or goes offline, the hot path continues unaffected. Backpressure from persistence never reaches the pipeline. The two concerns cannot interfere because they share no code path.
